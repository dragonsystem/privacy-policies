<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ユーザーマニュアル — TATTVA</title>
  <style>
    :root { --accent: #3b5bdb; --dark: #1A1A1A; --gray: #666; --bg: #FAFAF8; --border: #E8E3DA; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; background: var(--bg); color: var(--dark); line-height: 1.8; }
    header { background: var(--dark); padding: 48px 24px 40px; text-align: center; }
    header h1 { color: #7c9bff; font-size: 28px; margin-bottom: 8px; }
    header p { color: rgba(255,255,255,0.55); font-size: 14px; }
    main { max-width: 600px; margin: 0 auto; padding: 48px 24px 80px; }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px 28px;
      text-align: center;
    }
    .card p { font-size: 15px; color: var(--gray); margin-bottom: 24px; }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
    }
    .btn:hover { opacity: 0.9; }
    footer { text-align: center; padding: 32px 24px; font-size: 13px; color: var(--gray); border-top: 1px solid var(--border); }
  </style>
</head>
<body>
<header>
  <h1>TATTVA</h1>
  <p>ユーザーマニュアル / User Manual</p>
</header>
<main>
  <div class="card">
    <p>TATTVAの使い方・機能の説明はPDFマニュアルをご参照ください。</p>
    <a class="btn" href="./TATTVA_UserManual.pdf" target="_blank">📄 マニュアルを開く (PDF)</a>
  </div>
</main>
<footer>
  <p>© 2026 DRAGON SYSTEM (Ryu Kaneko) — TATTVA</p>
</footer>
</body>
</html>
